<!DOCTYPE html>
<html lang="es" data-theme="slate">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantLab Workbench</title>
  <link rel="stylesheet" href="/static/css/workbench.css" />
</head>
<body data-theme="slate">
  <a class="skip-link" href="#workspace" data-i18n="skip_to_content">Ir al contenido</a>
  <div id="desktop" class="desktop">
    <header class="top-banner" id="mode-banner" role="status">
      <span class="brand" data-i18n="app.name">QuantLab</span>
      <span class="banner-sep">·</span>
      <span id="banner-mode">modo —</span>
      <span class="banner-sep">·</span>
      <span id="banner-live" class="live-badge">LIVE_BLOCKED</span>
      <span class="banner-sep">·</span>
      <span id="banner-session" class="mono muted">session —</span>
      <span class="banner-sep">·</span>
      <span id="banner-chat" class="chat-system-banner" data-i18n="chat.banner">Asistente research — no envía órdenes</span>
    </header>
    <div id="workspace" class="workspace" aria-label="Escritorio" data-i18n-aria="aria.workspace" tabindex="-1"></div>
    <footer class="bottom-chrome" id="bottom-chrome">
      <div class="status-bar" id="status-bar" role="status" aria-label="Status bar" data-i18n-aria="aria.status">
        <span class="sb-item"><span class="sb-label" data-i18n="status.mode">mode</span> <span id="sb-mode" class="mono">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label" data-i18n="status.live">live</span> <span id="sb-live" class="mono live-badge">LIVE_BLOCKED</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label" data-i18n="status.session">session</span> <span id="sb-session" class="mono muted">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label" data-i18n="status.venue">venue</span> <span id="sb-venue" class="mono">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label" data-i18n="status.md">md</span> <span id="sb-md" class="mono">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label" data-i18n="status.heartbeat">hb</span> <span id="sb-heartbeat" class="mono sb-heartbeat">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item sb-version" title="Acerca de" data-i18n-title="pane.about">
          <button type="button" class="sb-version-btn" id="sb-version" aria-label="Versión QuantLab" data-i18n-aria="aria.version">v—</button>
        </span>
        <span class="sb-sep">·</span>
        <span class="sb-item sb-clock" id="sb-clock" class="mono"></span>
      </div>
      <div class="taskbar" id="taskbar" role="toolbar" aria-label="Barra de tareas" data-i18n-aria="aria.taskbar">
        <button type="button" class="start-btn" id="btn-start" title="Menú" aria-label="Menú inicio" data-i18n-aria="menu.start">QL</button>
        <div class="taskbar-windows" id="taskbar-windows" role="group" aria-label="Ventanas abiertas" data-i18n-aria="aria.windows"></div>
      </div>
    </footer>
  </div>

  <!-- F59 a11y: dialog shells (JS enriches inner content) -->
  <div id="command-palette" class="command-palette hidden" hidden role="dialog" aria-modal="true" aria-label="Command Palette" data-i18n-aria="aria.palette"></div>
  <div id="about-dialog" class="about-dialog hidden" hidden role="dialog" aria-modal="true" aria-label="Acerca de QuantLab" data-i18n-aria="aria.about"></div>
  <div id="onboarding-wizard" class="onboarding-wizard hidden" hidden role="dialog" aria-modal="true" aria-label="Onboarding QuantLab" data-i18n-aria="aria.onboarding"></div>

  <div id="start-menu" class="start-menu hidden" hidden>
    <div class="start-group" data-i18n="menu.workspaces">Espacios de trabajo</div>
    <button type="button" data-preset="research" title="Health + Backtest + Reports + Chat" data-i18n="preset.research">
      Research
    </button>
    <button type="button" data-preset="trading_paper" title="Market + Blotter + Positions + Session + Risk" data-i18n="preset.trading_paper">
      Trading Paper
    </button>
    <button type="button" data-preset="ops" title="Health + Settings + Docs + Catalog" data-i18n="preset.ops">
      Ops
    </button>
    <div id="custom-presets" class="custom-presets" aria-label="Custom presets"></div>
    <button type="button" id="btn-preset-save" title="Guardar layout actual como preset" data-i18n="preset.save">
      Guardar espacio actual…
    </button>
    <div class="start-group" data-i18n="menu.session">Sesión</div>
    <button type="button" data-open="health" data-i18n="pane.health">Salud / Modo</button>
    <button type="button" data-open="market" data-i18n="pane.market">Market Data</button>
    <button type="button" data-open="universe" data-i18n="pane.universe">Universe</button>
    <button type="button" data-open="catalog" data-i18n="pane.catalog">Data Catalog</button>
    <button type="button" data-open="blotter" data-i18n="pane.blotter">Paper Blotter</button>
    <button type="button" data-open="journal" data-i18n="pane.journal">Journal</button>
    <button type="button" data-open="paper_session" data-i18n="pane.paper_session">Sesión Paper</button>
    <button type="button" data-open="positions" data-i18n="pane.positions">Posiciones</button>
    <button type="button" data-open="risk" data-i18n="pane.risk">Riesgo</button>
    <button type="button" data-open="reconciliation" data-i18n="pane.reconciliation">Reconciliación</button>
    <button type="button" data-open="chat" data-i18n="pane.chat">Chat IA</button>
    <div class="start-group" data-i18n="menu.lab">Laboratorio</div>
    <button type="button" data-open="backtest" data-i18n="pane.backtest">Backtest</button>
    <button type="button" data-open="scanner" data-i18n="pane.scanner">Alpha Scanner</button>
    <button type="button" data-open="metrics" data-i18n="pane.metrics">Metrics / Último</button>
    <button type="button" data-open="reports" data-i18n="pane.reports">Reports</button>
    <button type="button" data-open="experiments" data-i18n="pane.experiments">Experiments</button>
    <button type="button" data-open="optimize" data-i18n="pane.optimize">Optimizer</button>
    <button type="button" data-open="montecarlo" data-i18n="pane.montecarlo">Monte Carlo</button>
    <button type="button" data-open="features" data-i18n="pane.features">Features</button>
    <button type="button" data-open="export_hb" data-i18n="pane.export_hb">Hummingbot Export</button>
    <button type="button" data-open="validation" data-i18n="pane.validation">Validation Splits</button>
    <div class="start-group" data-i18n="menu.windows">Ventanas</div>
    <button type="button" data-wm-action="minimize_all" data-i18n="action.minimize_all">
      Minimize all
    </button>
    <button type="button" data-wm-action="restore_all" data-i18n="action.restore_all">
      Restore all windows
    </button>
    <button type="button" data-wm-action="cascade_windows" data-i18n="action.cascade_windows">
      Cascade windows
    </button>
    <button type="button" data-wm-action="tile_windows" data-i18n="action.tile_windows">
      Tile windows
    </button>
    <button type="button" data-wm-action="bring_to_front" data-i18n="action.bring_to_front">
      Bring to Front
    </button>
    <button type="button" data-wm-action="send_to_back" data-i18n="action.send_to_back">
      Send to Back
    </button>
    <button type="button" data-wm-action="maximize_window" data-i18n="action.maximize_window">
      Maximize window
    </button>
    <button type="button" data-wm-action="restore_from_maximize" data-i18n="action.restore_from_maximize">
      Restore from Maximize
    </button>
    <div class="start-group" data-i18n="menu.system">Sistema</div>
    <button type="button" data-open="sessions" data-i18n="pane.sessions">Sessions</button>
    <button type="button" data-open="activity" data-i18n="pane.activity">Activity</button>
    <button type="button" data-open="access_log" data-i18n="pane.access_log">Access Log</button>
    <button type="button" data-open="backups" data-i18n="pane.backups">Backups</button>
    <button type="button" data-open="ops_metrics" data-i18n="pane.ops_metrics">Ops Metrics</button>
    <button type="button" data-open="settings" data-i18n="pane.settings">Settings</button>
    <button type="button" data-open="docs" data-i18n="pane.docs">Help / Docs</button>
    <button type="button" data-open="about" data-i18n="pane.about">Acerca de</button>
  </div>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/toasts.js"></script>
  <script src="/static/js/wm.js"></script>
  <script src="/static/js/command_palette.js"></script>
  <script src="/static/js/panes/lab_common.js"></script>
  <script src="/static/js/panes/health.js"></script>
  <script src="/static/js/panes/market.js"></script>
  <script src="/static/js/panes/universe.js"></script>
  <script src="/static/js/panes/catalog.js"></script>
  <script src="/static/js/panes/blotter.js"></script>
  <script src="/static/js/panes/journal.js"></script>
  <script src="/static/js/panes/paper_session.js"></script>
  <script src="/static/js/panes/positions.js"></script>
  <script src="/static/js/panes/risk.js"></script>
  <script src="/static/js/panes/reconciliation.js"></script>
  <script src="/static/js/panes/chat.js"></script>
  <script src="/static/js/panes/backtest.js"></script>
  <script src="/static/js/panes/scanner.js"></script>
  <script src="/static/js/panes/metrics.js"></script>
  <script src="/static/js/panes/reports.js"></script>
  <script src="/static/js/panes/experiments.js"></script>
  <script src="/static/js/panes/optimize.js"></script>
  <script src="/static/js/panes/montecarlo.js"></script>
  <script src="/static/js/panes/features.js"></script>
  <script src="/static/js/panes/export_hb.js"></script>
  <script src="/static/js/panes/validation.js"></script>
  <script src="/static/js/panes/sessions.js"></script>
  <script src="/static/js/panes/activity.js"></script>
  <script src="/static/js/panes/access_log.js"></script>
  <script src="/static/js/panes/backups.js"></script>
  <script src="/static/js/panes/ops_metrics.js"></script>
  <script src="/static/js/panes/settings.js"></script>
  <script src="/static/js/panes/docs.js"></script>
  <script src="/static/js/about.js"></script>
  <script src="/static/js/onboarding.js"></script>
  <script src="/static/js/shell.js"></script>
</body>
</html>
