<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantLab Workbench</title>
  <link rel="stylesheet" href="/static/css/workbench.css" />
</head>
<body>
  <div id="desktop" class="desktop">
    <header class="top-banner" id="mode-banner" role="status">
      <span class="brand">QuantLab</span>
      <span class="banner-sep">·</span>
      <span id="banner-mode">modo —</span>
      <span class="banner-sep">·</span>
      <span id="banner-live" class="live-badge">LIVE_BLOCKED</span>
      <span class="banner-sep">·</span>
      <span id="banner-session" class="mono muted">session —</span>
      <span class="banner-sep">·</span>
      <span id="banner-chat" class="chat-system-banner">Asistente research — no envía órdenes</span>
    </header>
    <div id="workspace" class="workspace" aria-label="Escritorio"></div>
    <footer class="bottom-chrome" id="bottom-chrome">
      <div class="status-bar" id="status-bar" role="status" aria-label="Status bar">
        <span class="sb-item"><span class="sb-label">mode</span> <span id="sb-mode" class="mono">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label">live</span> <span id="sb-live" class="mono live-badge">LIVE_BLOCKED</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label">session</span> <span id="sb-session" class="mono muted">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label">venue</span> <span id="sb-venue" class="mono">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item"><span class="sb-label">md</span> <span id="sb-md" class="mono">—</span></span>
        <span class="sb-sep">·</span>
        <span class="sb-item sb-version" title="Acerca de">
          <button type="button" class="sb-version-btn" id="sb-version" aria-label="Versión QuantLab">v—</button>
        </span>
        <span class="sb-sep">·</span>
        <span class="sb-item sb-clock" id="sb-clock" class="mono"></span>
      </div>
      <div class="taskbar" id="taskbar">
        <button type="button" class="start-btn" id="btn-start" title="Menú">QL</button>
        <div class="taskbar-windows" id="taskbar-windows"></div>
      </div>
    </footer>
  </div>

  <div id="start-menu" class="start-menu hidden" hidden>
    <div class="start-group">Espacios de trabajo</div>
    <button type="button" data-preset="research" title="Health + Backtest + Reports + Chat">
      Research
    </button>
    <button type="button" data-preset="trading_paper" title="Market + Blotter + Positions + Session + Risk">
      Trading Paper
    </button>
    <button type="button" data-preset="ops" title="Health + Settings + Docs + Catalog">
      Ops
    </button>
    <div class="start-group">Sesión</div>
    <button type="button" data-open="health">Salud / Modo</button>
    <button type="button" data-open="market">Market Data</button>
    <button type="button" data-open="universe">Universe</button>
    <button type="button" data-open="catalog">Data Catalog</button>
    <button type="button" data-open="blotter">Paper Blotter</button>
    <button type="button" data-open="journal">Journal</button>
    <button type="button" data-open="paper_session">Sesión Paper</button>
    <button type="button" data-open="positions">Posiciones</button>
    <button type="button" data-open="risk">Riesgo</button>
    <button type="button" data-open="chat">Chat IA</button>
    <div class="start-group">Laboratorio</div>
    <button type="button" data-open="backtest">Backtest</button>
    <button type="button" data-open="scanner">Alpha Scanner</button>
    <button type="button" data-open="metrics">Metrics / Último</button>
    <button type="button" data-open="reports">Reports</button>
    <button type="button" data-open="experiments">Experiments</button>
    <button type="button" data-open="optimize">Optimizer</button>
    <button type="button" data-open="montecarlo">Monte Carlo</button>
    <button type="button" data-open="features">Features</button>
    <button type="button" data-open="export_hb">Hummingbot Export</button>
    <button type="button" data-open="validation">Validation Splits</button>
    <div class="start-group">Sistema</div>
    <button type="button" data-open="sessions">Sessions</button>
    <button type="button" data-open="activity">Activity</button>
    <button type="button" data-open="ops_metrics">Ops Metrics</button>
    <button type="button" data-open="settings">Settings</button>
    <button type="button" data-open="docs">Help / Docs</button>
    <button type="button" data-open="about">Acerca de</button>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/toasts.js"></script>
  <script src="/static/js/wm.js"></script>
  <script src="/static/js/command_palette.js"></script>
  <script src="/static/js/panes/lab_common.js"></script>
  <script src="/static/js/panes/health.js"></script>
  <script src="/static/js/panes/market.js"></script>
  <script src="/static/js/panes/universe.js"></script>
  <script src="/static/js/panes/catalog.js"></script>
  <script src="/static/js/panes/blotter.js"></script>
  <script src="/static/js/panes/journal.js"></script>
  <script src="/static/js/panes/paper_session.js"></script>
  <script src="/static/js/panes/positions.js"></script>
  <script src="/static/js/panes/risk.js"></script>
  <script src="/static/js/panes/chat.js"></script>
  <script src="/static/js/panes/backtest.js"></script>
  <script src="/static/js/panes/scanner.js"></script>
  <script src="/static/js/panes/metrics.js"></script>
  <script src="/static/js/panes/reports.js"></script>
  <script src="/static/js/panes/experiments.js"></script>
  <script src="/static/js/panes/optimize.js"></script>
  <script src="/static/js/panes/montecarlo.js"></script>
  <script src="/static/js/panes/features.js"></script>
  <script src="/static/js/panes/export_hb.js"></script>
  <script src="/static/js/panes/validation.js"></script>
  <script src="/static/js/panes/sessions.js"></script>
  <script src="/static/js/panes/activity.js"></script>
  <script src="/static/js/panes/ops_metrics.js"></script>
  <script src="/static/js/panes/settings.js"></script>
  <script src="/static/js/panes/docs.js"></script>
  <script src="/static/js/about.js"></script>
  <script src="/static/js/onboarding.js"></script>
  <script src="/static/js/shell.js"></script>
</body>
</html>
