<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantLab Workbench</title>
  <link rel="stylesheet" href="/static/css/workbench.css" />
</head>
<body>
  <div id="desktop" class="desktop">
    <header class="top-banner" id="mode-banner" role="status">
      <span class="brand">QuantLab</span>
      <span class="banner-sep">·</span>
      <span id="banner-mode">modo —</span>
      <span class="banner-sep">·</span>
      <span id="banner-live" class="live-badge">LIVE_BLOCKED</span>
      <span class="banner-sep">·</span>
      <span id="banner-session" class="mono muted">session —</span>
      <span class="banner-sep">·</span>
      <span id="banner-chat" class="chat-system-banner">Asistente research — no envía órdenes</span>
    </header>
    <div id="workspace" class="workspace" aria-label="Escritorio"></div>
    <footer class="taskbar" id="taskbar">
      <button type="button" class="start-btn" id="btn-start" title="Menú">QL</button>
      <div class="taskbar-windows" id="taskbar-windows"></div>
      <div class="taskbar-clock" id="taskbar-clock"></div>
    </footer>
  </div>

  <div id="start-menu" class="start-menu hidden" hidden>
    <div class="start-group">Sesión</div>
    <button type="button" data-open="health">Salud / Modo</button>
    <button type="button" data-open="market">Market Data</button>
    <button type="button" data-open="blotter">Paper Blotter</button>
    <button type="button" data-open="positions">Posiciones</button>
    <button type="button" data-open="chat">Chat IA</button>
    <div class="start-group">Laboratorio</div>
    <button type="button" data-open="backtest">Backtest</button>
    <button type="button" data-open="scanner">Alpha Scanner</button>
    <button type="button" data-open="metrics">Metrics / Último</button>
    <button type="button" data-open="experiments">Experiments</button>
    <button type="button" data-open="optimize">Optimizer</button>
    <button type="button" data-open="montecarlo">Monte Carlo</button>
    <button type="button" data-open="features">Features</button>
    <button type="button" data-open="export_hb">Hummingbot Export</button>
    <button type="button" data-open="validation">Validation Splits</button>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/wm.js"></script>
  <script src="/static/js/panes/lab_common.js"></script>
  <script src="/static/js/panes/health.js"></script>
  <script src="/static/js/panes/market.js"></script>
  <script src="/static/js/panes/blotter.js"></script>
  <script src="/static/js/panes/positions.js"></script>
  <script src="/static/js/panes/chat.js"></script>
  <script src="/static/js/panes/backtest.js"></script>
  <script src="/static/js/panes/scanner.js"></script>
  <script src="/static/js/panes/metrics.js"></script>
  <script src="/static/js/panes/experiments.js"></script>
  <script src="/static/js/panes/optimize.js"></script>
  <script src="/static/js/panes/montecarlo.js"></script>
  <script src="/static/js/panes/features.js"></script>
  <script src="/static/js/panes/export_hb.js"></script>
  <script src="/static/js/panes/validation.js"></script>
  <script src="/static/js/shell.js"></script>
</body>
</html>
