name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen --extra dev

      - name: Forbid versioned caches/bytecode
        run: |
          if git ls-files | grep -E '(__pycache__|\.pyc$|\.pyo$|\.pytest_cache|\.mypy_cache|\.ruff_cache)'; then
            echo "Caches/bytecode versionados detectados" >&2
            exit 1
          fi

      - name: Required documentation present
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f LESSONS_LEARNED.md
          test -f REVIEW_REQUEST.md
          test -f docs/MANIFEST_VERSIONING.md
          test -f docs/REVIEW_PACKAGE.md
          test -f docs/TECHNICAL_DEBT.md
          test -f docs/ci/ci.yml.example
          test -f .gitleaks.toml
          test -f uv.lock
          test -f scripts/build_review_package.py
          test -f scripts/review_package_policy.py
          test -f scripts/review_package_quality.py
          test -f .github/workflows/ci.yml

      - name: Ruff lint
        run: uv run ruff check src/quantlab scripts

      - name: Ruff format check
        run: uv run ruff format --check src/quantlab scripts

      - name: Mypy (strict package)
        run: uv run mypy --strict src/quantlab

      - name: Pytest with coverage + JUnit
        env:
          QUANTLAB_ENABLE_LIVE_TRADING: DISABLED
        run: |
          mkdir -p reports
          uv run pytest \
            --junitxml=reports/pytest_junit.xml \
            --cov=quantlab \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Health + vertical slice smoke
        env:
          QUANTLAB_ENABLE_LIVE_TRADING: DISABLED
        run: |
          uv run quantlab-health
          uv run quantlab-vertical-slice

      - name: Remote URL clean (no embedded tokens)
        run: uv run python scripts/check_git_remote_clean.py

      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --no-git
