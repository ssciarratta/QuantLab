# A3 exchange config — NO secrets

enabled: false
environment: simulation  # simulation | production

market_data:
  enabled: true
  websocket: true
  depth: 5
  reconnect: true
  queue_maxsize: 10000

execution:
  enabled: false  # research-prod: órdenes bloqueadas por defecto
  allow_live_orders: false
  account_allowlist: []
  require_live_confirmation: true

storage:
  raw_root: data/raw/a3
  processed_root: data/processed/a3
  catalog_path: data/catalog/quantlab_catalog.sqlite
  kill_switch_path: data/runtime/kill_switch.json

risk:
  max_order_quantity: 1
  max_notional: null
  symbol_allowlist: []
  reject_if_insufficient_info: true
  max_market_data_age_seconds: 30

websocket:
  backoff_initial_seconds: 1
  backoff_max_seconds: 60
