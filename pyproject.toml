[project]
name = "quantlab"
version = "1.01.0"
description = "Laboratorio de investigación cuantitativa"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QuantLab" }]
dependencies = [
    "structlog>=24.4.0",
    "PyYAML>=6.0.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyrofex>=0.5.0",
    "duckdb>=1.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
]
# Kronos-inside-Scanner (CPU/GPU). No está en deps base: QuantLab arranca sin esto.
kronos = [
    "torch>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "einops>=0.8.0",
    "huggingface_hub>=0.33.0",
    "safetensors>=0.6.0",
    "tqdm>=4.67.0",
]
# Alpha ML ranking (LightGBM). Opcional: QuantLab arranca sin esto; fail-closed si no hay modelo.
ml = [
    "lightgbm>=4.3.0",
    "numpy>=1.26.0",
]

[project.scripts]
quantlab-vertical-slice = "quantlab.vertical_slice.runner:main"
quantlab-a3 = "quantlab.data.exchanges.a3.cli:main"
quantlab-fase4-slice = "quantlab.vertical_slice.fase4:main"
quantlab-health = "quantlab.infra.health:main"
quantlab-workbench = "quantlab.workbench.launch:main"
quantlab-testnet = "quantlab.brokers.binance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["reviews", "QuantLab_Review_Fase_*.zip"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quantlab"]
mypy_path = "src:scripts"
files = ["src", "tests", "scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["review_package_policy", "build_review_package", "review_package_quality"]
strict = true

[[tool.mypy.overrides]]
module = ["pyRofex", "pyRofex.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "torch", "torch.*", "pandas", "pandas.*", "einops", "einops.*", "model", "model.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests/unit/workbench"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["quantlab"]
branch = true
omit = [
    "*/quantlab/data/exchanges/a3/cli.py",
    "*/quantlab/data/exchanges/a3/client.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
]
