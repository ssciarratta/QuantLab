[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.2.0"
description = "Laboratorio profesional de investigación cuantitativa"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "QuantLab Team" },
]

dependencies = [
    "pydantic>=2.7,<3",
    "structlog>=24.1,<25",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "mypy>=1.10,<2",
    "ruff>=0.4,<1",
    "types-PyYAML>=6.0",
]

[project.scripts]
quantlab-vertical-slice = "quantlab.cli:vertical_slice"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "S",
    "T20",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "S101",  # assert allowed in tests
    "TC001",   # Protocol imports needed at runtime
    "TC003",   # stdlib imports used in frozen dataclass defaults
    "S607",    # git path is expected to be in PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/quantlab/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
mypy_path = "src"
packages = ["quantlab"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["quantlab"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
