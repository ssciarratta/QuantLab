# Gitleaks configuration for QuantLab
# Adopted per audit requirement: automatic secret scanning
# Tool choice rationale: Gitleaks is lightweight, fast, CI-friendly,
# and has excellent pattern coverage for tokens, passwords, API keys,
# private keys, and cloud credentials.

title = "QuantLab Gitleaks Config"

[allowlist]
description = "Allowed patterns"
paths = [
    '''\.gitleaks\.toml''',
    '''\.gitignore''',
    '''REVIEW_REQUEST\.md''',
    '''CHANGELOG\.md''',
    '''LESSONS_LEARNED\.md''',
    '''docs/.*\.md''',
    '''learning/.*\.txt''',
]
